<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<link rel=icon href=data:,>
<title>μmsg</title>
<style>
:root{color-scheme:dark}
body{font:14px/1.5 system-ui;max-width:680px;margin:24px auto;padding:0 16px}
header,#topics{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:18px;margin:0 auto 0 0}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d29922;margin-right:8px}
#dot.ok{background:#3fb950}
#dot.err{background:#f85149}
button{font:inherit;padding:4px 10px;border-radius:6px;border:1px solid #444;background:#222;color:inherit;cursor:pointer}
button.on{background:#1f6feb;border-color:#388bfd}
.c{border:1px solid #333;border-left:4px solid #333;border-radius:6px;padding:10px 12px;margin-bottom:8px}
.p1,.p2{opacity:.7}
.p4{border-left-color:#d29922}
.p5{border-left-color:#f85149}
.m{font-size:12px;opacity:.7;display:flex;justify-content:space-between;margin-bottom:4px}
.b{white-space:pre-wrap;word-break:break-word}
</style>
<header><h1><span id=dot></span>μmsg</h1><button id=perm hidden>Alerts</button></header>
<div id=topics></div>
<div id=list>Waiting...</div>
<script>
let a=[],tags=new Set(),f="",ready=0,N=window.Notification;
if(N&&N.permission=="default"){perm.hidden=0;perm.onclick=()=>N.requestPermission().then(p=>perm.hidden=p!="default")}
let esc=s=>String(s??"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
topics.onclick=e=>{if(e.target.tagName=="BUTTON"){f=e.target.dataset.t;r()}};
function r(){
topics.innerHTML=tags.size?["",...tags].map(t=>`<button class="${f==t?"on":""}" data-t="${esc(t)}">${esc(t||"All")}</button>`).join(""):"";
let s=f?a.filter(n=>n.topic==f):a;
list.innerHTML=s.length?s.map(n=>{let p=n.priority>=1&&n.priority<=5?n.priority|0:3;return`<div class="c p${p}"><div class=m><b>${esc(n.topic)}</b><span>${new Date(n.ts*1000).toLocaleString()}</span></div>${n.title?`<div><b>${esc(n.title)}</b></div>`:""}<div class=b>${esc(n.msg)}</div></div>`}).join(""):"No messages yet.";
}
let es=new EventSource("/all");
es.onopen=()=>{dot.className="ok";setTimeout(()=>ready=1,300)};
es.onerror=()=>dot.className="err";
es.onmessage=e=>{
let n;try{n=JSON.parse(e.data)}catch{return}
if(a.some(x=>x.id==n.id))return;
a.unshift(n);if(a.length>64)a.pop();
if(n.topic)tags.add(n.topic);
r();
if(ready&&N&&N.permission=="granted")new N(n.title||n.topic,{body:n.msg});
};
</script>
