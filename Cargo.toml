[package]
name = "umsg"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1", default-features = false, features = ["net", "event", "stdio", "time", "fs"] }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
